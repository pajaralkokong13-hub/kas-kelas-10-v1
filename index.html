<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kas Kelas 10 Pro</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,sans-serif}
  body{background:#f1f5f9;margin:0;padding:12px;color:#1e293b}
  .wrap{max-width:940px;margin:auto}
  .head{background:linear-gradient(135deg,#4338ca,#7c3aed,#db2777);color:#fff;padding:18px;border-radius:16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .head h1{margin:0;font-size:21px}.head p{margin:4px 0 0;font-size:12px;opacity:.9}
  .per{background:rgba(255,255,255,.2);padding:7px 10px;border-radius:10px;display:flex;gap:6px}
  .per select,.per input{border:none;padding:5px 8px;border-radius:6px;font-weight:700;font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .sc{background:#fff;padding:12px;border-radius:12px;border:1px solid #e2e8f0}
  .sc small{font-size:11px;font-weight:700;color:#64748b}
  .sc div{font-size:18px;font-weight:800;margin-top:4px}
  .g div{color:#10b981}.r div{color:#ef4444}.b div{color:#3b82f6}.p div{color:#8b5cf6}
  .tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
  .tab{flex:1;min-width:105px;padding:10px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;font-weight:700;font-size:13px;color:#475569;cursor:pointer}
  .tab.act{background:#4f46e5;color:#fff;border-color:#4f46e5}
  .box{background:#fff;padding:15px;border-radius:14px;border:1px solid #e2e8f0;margin-bottom:14px;display:none}
  .box.show{display:block}
  .tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-bottom:12px}
  .fb{padding:6px 10px;border-radius:20px;border:1px solid #cbd5e1;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
  .fb.act{background:#1e293b;color:#fff}
  .srch{padding:6px 11px;border:1px solid #cbd5e1;border-radius:20px;font-size:13px;width:160px}
  .tw{overflow-x:auto;border:1px solid #e2e8f0;border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f8fafc;color:#64748b;padding:9px 6px;border-bottom:1px solid #e2e8f0}
  td{padding:8px 6px;border-bottom:1px solid #e2e8f0;text-align:center}
  td.nm{text-align:left;font-weight:600;white-space:nowrap}
  .tm{display:block;width:62px;margin:4px auto 0;font-size:11px;padding:2px;border:1px solid #cbd5e1;border-radius:4px;text-align:center}
  input[type=checkbox]{width:18px;height:18px;accent-color:#4f46e5}
  .bd{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
  .ok{background:#ecfdf5;color:#10b981}.no{background:#fef3c7;color:#d97706}
  .mini{padding:4px 7px;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;margin:0 1px}
  .mok{background:#dcfce7;color:#15803d}.mno{background:#fee2e2;color:#b91c1c}
  .fg{display:grid;grid-template-columns:130px 120px 1fr 110px auto;gap:8px;margin-bottom:12px}
  @media(max-width:680px){.fg{grid-template-columns:1fr}}
  .fg input,.fg select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px}
  .btn{padding:9px 14px;border:none;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}
  .bp{background:#4f46e5;color:#fff}.bw{background:#22c55e;color:#fff}.bdl{background:#fef2f2;color:#ef4444;padding:5px 8px}.brs{background:#e2e8f0;color:#475569}.bsec{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}
  .bar-bg{background:#e2e8f0;height:10px;border-radius:10px;overflow:hidden;margin-top:6px}
  .bar-fill{background:linear-gradient(90deg,#4f46e5,#10b981);height:100%}
  .act{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>📘 Kas Kelas 10</h1><p id="td">11 Murid • Rp3.000 / Minggu</p></div>
    <div class="per">
      <select id="bln" onchange="updPer()"><option>Januari</option><option>Februari</option><option>Maret</option><option>April</option><option>Mei</option><option>Juni</option><option>Juli</option><option>Agustus</option><option>September</option><option>Oktober</option><option selected>November</option><option>Desember</option></select>
      <input type="number" id="thn" value="2026" style="width:68px" onchange="updPer()">
    </div>
  </div>
  <div class="stats">
    <div class="sc g"><small>KAS MASUK</small><div id="tm">Rp0</div></div>
    <div class="sc r"><small>PENGELUARAN</small><div id="tk">Rp0</div></div>
    <div class="sc b"><small>SISA SALDO</small><div id="ts">Rp0</div></div>
    <div class="sc p"><small>TARGET</small><div id="tp">0%</div></div>
  </div>
  <div class="tabs">
    <button type="button" class="tab act" onclick="goTab(0,this)">📋 1. Iuran</button>
    <button type="button" class="tab" onclick="goTab(1,this)">💸 2. Keluar</button>
    <button type="button" class="tab" onclick="goTab(2,this)">🏆 3. Poin</button>
  </div>
  <div class="box show" id="tab0">
    <div class="tools">
      <div><button type="button" class="fb act" onclick="setF('all',this)">Semua</button> <button type="button" class="fb" onclick="setF('ok',this)">✅ Lunas</button> <button type="button" class="fb" onclick="setF('no',this)">⏳ Belum</button></div>
      <input class="srch" id="cari" placeholder="🔍 Cari nama..." oninput="dr()">
    </div>
    <div class="tw"><table><thead id="hk"></thead><tbody id="bk"></tbody></table></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn bp" onclick="addM()">+ Minggu</button><button type="button" class="btn bsec" onclick="delM()">- Hapus Minggu</button></div>
  </div>
  <div class="box" id="tab1">
    <div class="fg">
      <input type="date" id="to">
      <select id="kat"><option>🖊️ Alat Tulis</option><option>🧹 Kebersihan</option><option>🎉 Acara</option><option>📦 Lainnya</option></select>
      <input type="text" id="ko" placeholder="Keterangan...">
      <input type="number" id="no" placeholder="Nominal (Rp)">
      <button type="button" class="btn bp" onclick="addO()">+ Simpan</button>
    </div>
    <div class="tw"><table><thead><tr><th>No</th><th>Tgl</th><th>Kategori</th><th style="text-align:left">Keterangan</th><th>Nominal</th><th>Aksi</th></tr></thead><tbody id="bo"></tbody></table></div>
  </div>
  <div class="box" id="tab2">
    <h3 style="margin-top:0;font-size:15px">📊 Progres Bulan <span id="lp"></span></h3>
    <div class="bar-bg"><div class="bar-fill" id="pbar" style="width:0%"></div></div>
    <p id="ptxt" style="font-size:12px;color:#64748b;margin-bottom:14px"></p>
    <h3 style="font-size:15px">🏅 Peringkat Poin Rajin Bayar</h3>
    <div class="tw"><table><thead><tr><th>Rank</th><th style="text-align:left">Nama</th><th>Lunas</th><th>Poin</th><th>Status</th></tr></thead><tbody id="br"></tbody></table></div>
  </div>
  <div class="act">
    <button type="button" class="btn bw" onclick="wa()">📲 Kirim WA</button>
    <button type="button" class="btn bsec" onclick="bkp()">💾 Backup</button>
    <button type="button" class="btn brs" onclick="rst()">🔄 Reset</button>
  </div>
</div>
<script>
  var T=3000,K="kas10_split_ok",flt="all",N=["Aininda","Desi","Devin","Jaka","Haifa","Hilman","Alfa","Pajar","Rifky","Siska","Winda"];
  var svd=localStorage.getItem(K);
  var d=svd?JSON.parse(svd):{b:"November",t:2026,m:4,tm:["Mgg 1","Mgg 2","Mgg 3","Mgg 4"],s:N.map(function(n){return{n:n,b:[0,0,0,0]}}),k:[]};
  function rp(n){return"Rp"+n.toLocaleString("id-ID")}
  function sv(){localStorage.setItem(K,JSON.stringify(d));dr()}
  function goTab(i,el){document.querySelectorAll(".box").forEach(function(b,x){b.classList.toggle("show",x===i)});document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("act")});el.classList.add("act")}
  function setF(f,el){flt=f;document.querySelectorAll(".fb").forEach(function(b){b.classList.remove("act")});el.classList.add("act");dr()}
  function updPer(){d.b=document.getElementById("bln").value;d.t=document.getElementById("thn").value;sv()}
  function updTm(i,v){d.tm[i]=v;sv()}
  function dr(){
    document.getElementById("lp").innerText=d.b+" "+d.t;
    var q=document.getElementById("cari").value.toLowerCase();
    var h="<tr><th>No</th><th style='text-align:left'>Nama</th>";
    for(var m=0;m<d.m;m++)h+="<th>M"+(m+1)+"<input class='tm' value='"+(d.tm[m]||"Mgg "+(m+1))+"' onchange='updTm("+m+",this.value)'></th>";
    document.getElementById("hk").innerHTML=h+"<th>Cepat</th><th>Total</th><th>Status</th></tr>";
    var b="",inTot=0,rank=[];
    for(var i=0;i<d.s.length;i++){
      var s=d.s[i],jml=0,c="";
      for(var j=0;j<d.m;j++){if(s.b[j])jml++;c+="<td><input type='checkbox' "+(s.b[j]?"checked":"")+" onchange='ck("+i+","+j+")'></td>"}
      var sub=jml*T,lns=jml===d.m;inTot+=sub;
      rank.push({n:s.n,jml:jml,poin:jml*100,lns:lns});
      if(q&&s.n.toLowerCase().indexOf(q)===-1)continue;
      if(flt==="ok"&&!lns)continue;
      if(flt==="no"&&lns)continue;
      b+="<tr><td>"+(i+1)+"</td><td class='nm'>"+s.n+"</td>"+c+"<td><button type='button' class='mini mok' onclick='allRow("+i+",1)'>✓</button><button type='button' class='mini mno' onclick='allRow("+i+",0)'>✕</button></td><td><b>"+rp(sub)+"</b></td><td><span class='bd "+(lns?"ok'>Lunas":"no'>"+jml+"/"+d.m)+"</span></td></tr>";
    }
    document.getElementById("bk").innerHTML=b||"<tr><td colspan='12' style='color:#94a3b8'>Tidak ditemukan</td></tr>";
    var bo="",outTot=0;
    if(!d.k.length)bo="<tr><td colspan='6' style='color:#94a3b8'>Belum ada pengeluaran</td></tr>";
    else for(var k=0;k<d.k.length;k++){var o=d.k[k];outTot+=o.n;bo+="<tr><td>"+(k+1)+"</td><td>"+o.t+"</td><td>"+o.kat+"</td><td class='nm'>"+o.k+"</td><td style='color:#ef4444'><b>-"+rp(o.n)+"</b></td><td><button type='button' class='btn bdl' onclick='delO("+k+")'>Hapus</button></td></tr>"}
    document.getElementById("bo").innerHTML=bo;
    var tgt=d.s.length*d.m*T,pct=tgt?Math.round((inTot/tgt)*100):0;
    document.getElementById("tm").innerText=rp(inTot);document.getElementById("tk").innerText=rp(outTot);document.getElementById("ts").innerText=rp(inTot-outTot);document.getElementById("tp").innerText=pct+"%";
    document.getElementById("pbar").style.width=pct+"%";
    document.getElementById("ptxt").innerText="Terkumpul "+rp(inTot)+" dari "+rp(tgt);
    rank.sort(function(a,b){return b.poin-a.poin});
    var br="";
    for(var r=0;r<rank.length;r++){var x=rank[r];br+="<tr><td><b>#"+(r+1)+"</b></td><td class='nm'>"+x.n+"</td><td>"+x.jml+"/"+d.m+"</td><td><b>"+x.poin+"</b></td><td>"+(x.lns?"🌟 Teladan":(x.jml>0?"👍 Aktif":"⚠️ Nunggak"))+"</td></tr>"}
    document.getElementById("br").innerHTML=br;
  }
  function ck(i,j){d.s[i].b[j]=d.s[i].b[j]?0:1;sv()}
  function allRow(i,v){for(var j=0;j<d.m;j++)d.s[i].b[j]=v;sv()}
  function addM(){d.m++;d.tm.push("Mgg "+d.m);for(var i=0;i<d.s.length;i++)d.s[i].b.push(0);sv()}
  function delM(){if(d.m<=1)return alert("Minimal 1 minggu!");if(confirm("Hapus minggu terakhir?")){d.m--;d.tm.pop();for(var i=0;i<d.s.length;i++)d.s[i].b.pop();sv()}}
  function addO(){var tr=document.getElementById("to").value,kat=document.getElementById("kat").value,k=document.getElementById("ko").value.trim(),n=parseInt(document.getElementById("no").value,10);if(!k||!n||n<=0)return alert("Isi keterangan & nominal!");var ti=tr?new Date(tr).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"-";d.k.push({t:ti,kat:kat,k:k,n:n});document.getElementById("ko").value="";document.getElementById("no").value="";sv()}
  function delO(i){if(confirm("Hapus?"))d.k.splice(i,1),sv()}
  function rst(){if(confirm("Reset semua data?"))localStorage.removeItem(K),location.reload()}
  function bkp(){prompt("Salin kode backup ini:",JSON.stringify(d))}
  function wa(){var t="*📊 LAPORAN KAS KELAS 10*\n*Periode: "+d.b+" "+d.t+"*\n\n*Pemasukan:*\n",im=0,om=0;d.s.forEach(function(s,i){var j=s.b.filter(Boolean).length,sb=j*T;im+=sb;t+=(i+1)+". "+s.n+": "+rp(sb)+(j===d.m?" ✅":" ("+j+"/"+d.m+")")+"\n"});t+="\n*Pengeluaran:*\n"+(d.k.length?"":"- Nihil\n");d.k.forEach(function(o,i){om+=o.n;t+=(i+1)+". ["+o.t+"] "+o.k+": -"+rp(o.n)+"\n"});t+="\n*Masuk:* "+rp(im)+"\n*Keluar:* "+rp(om)+"\n*Saldo Akhir:* "+rp(im-om);window.open("https://wa.me"+encodeURIComponent(t),"_blank")}
  var nw=new Date();
  document.getElementById("td").innerText="11 Murid • Rp3.000/Mgg • 📅 "+nw.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
  document.getElementById("to").value=nw.getFullYear()+"-"+String(nw.getMonth()+1).padStart(2,"0")+"-"+String(nw.getDate()).padStart(2,"0");
  document.getElementById("bln").value=d.b;document.getElementById("thn").value=d.t;
  dr();
</script>
</body>
</html>
